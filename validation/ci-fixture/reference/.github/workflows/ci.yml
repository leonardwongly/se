name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      flows: ${{ steps.select.outputs.flows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python ci/affected.py --base "${BASE:-}" >> "$GITHUB_OUTPUT"

  # Required by security policy SEC-7: runs on every pull request, whatever changed.
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest tests.security.test_security -v

  billing:
    needs: changes
    if: github.event_name == 'push' || contains(needs.changes.outputs.flows, 'billing')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/billing -t . -v

  api:
    needs: changes
    if: github.event_name == 'push' || contains(needs.changes.outputs.flows, 'api')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/api -t . -v

  reports:
    needs: changes
    if: github.event_name == 'push' || contains(needs.changes.outputs.flows, 'reports')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests/reports -t . -v
