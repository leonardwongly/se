name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: python -m compileall -q app tests
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      # Required by security policy SEC-7: the security tests must run on every pull request.
      - name: Security gate
        run: python -m unittest tests.security.test_security -v
